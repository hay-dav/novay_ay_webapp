services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./infra/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./backend/public:/var/www/html/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [app]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}/api/v1
        VITE_WS_HOST: ${API_DOMAIN}
        VITE_WS_PORT: "443"
        VITE_WS_KEY: ${PUSHER_APP_KEY}
    restart: unless-stopped
    networks: [app]

  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [app]

  queue:
    <<: *backend
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=600 --max-time=3600
    healthcheck:
      disable: true

  scheduler:
    <<: *backend
    command: php artisan schedule:work
    healthcheck:
      disable: true

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_METRICS_ENABLED: "false"
    networks: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

port: 7880
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: true

room:
  auto_create: true
  empty_timeout: 300
  departure_timeout: 20

# TLS traffic for turn.lazareva-secret.ru is passed through HAProxy on public
# port 443 to this internal listener. LiveKit authenticates TURN users from
# the existing signal connection; no static browser credentials are exposed.
turn:
  enabled: true
  domain: turn.lazareva-secret.ru
  tls_port: 5349
  udp_port: 3478
  relay_range_start: 30000
  relay_range_end: 40000
  cert_file: /etc/letsencrypt/live/lazareva-secret.ru/fullchain.pem
  key_file: /etc/letsencrypt/live/lazareva-secret.ru/privkey.pem

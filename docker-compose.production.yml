services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./infra/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
      - ./backend/public:/var/www/html/public:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [app]

  haproxy:
    image: haproxy:3.1-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./infra/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      gateway:
        condition: service_started
      livekit:
        condition: service_started
    networks: [app]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN}/api/v1
        VITE_WS_HOST: ${API_DOMAIN}
        VITE_WS_PORT: "443"
        VITE_WS_KEY: ${PUSHER_APP_KEY}
    restart: unless-stopped
    networks: [app]

  backend: &backend
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: ./backend/.env.production
    volumes:
      # Egress writes the original recording here; the media worker reads it
      # locally, transcodes it, then uploads only the finished file to S3.
      - ./backend/storage/app/live-egress:/var/www/html/storage/app/live-egress
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [app]

  queue:
    <<: *backend
    command: php artisan queue:work --queue=broadcasts,default --sleep=1 --tries=3 --timeout=600 --max-time=3600
    healthcheck:
      disable: true

  live-queue:
    <<: *backend
    command: php artisan queue:work --queue=live --sleep=1 --tries=5 --timeout=60 --max-time=3600
    healthcheck:
      disable: true

  notification-queue:
    <<: *backend
    command: php artisan queue:work --queue=notifications --sleep=1 --tries=3 --timeout=100 --max-time=3600
    healthcheck:
      disable: true

  media:
    <<: *backend
    command: php artisan queue:work --queue=media --sleep=1 --tries=2 --timeout=1800 --max-time=3600
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      disable: true

  scheduler:
    <<: *backend
    command: php artisan schedule:work
    healthcheck:
      disable: true

  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_APP_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_APP_SECRET}
      SOKETI_METRICS_ENABLED: "false"
    networks: [app]

  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # LiveKit and Egress must share the same Redis bus. Without it the
      # StartRoomCompositeEgress request waits until the API returns 503.
      REDIS_HOST: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./infra/livekit/livekit.production.yaml:/etc/livekit.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [app]

  # Browser recording is unreliable on iOS when the tab is backgrounded.
  # Egress subscribes to the LiveKit room on the server and writes the
  # composite recording to the local shared volume. The media worker uploads
  # the optimized final file to the private S3 bucket after the live ends.
  egress:
    image: livekit/egress:v1.13
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        health_port: 8081
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        cpu_cost:
          room_composite_cpu_cost: 3.0
        session_limits:
          file_output_max_duration: 4h
    cap_add:
      - SYS_ADMIN
    volumes:
      - ./backend/storage/app/live-egress:/out
    # RoomComposite requires four CPU credits in Egress v1.13. This is a
    # runtime ceiling rather than a reservation; only one recording is active.
    cpus: 4.0
    mem_limit: 4g
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [app]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
